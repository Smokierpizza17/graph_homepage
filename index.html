<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- maximum-scale/user-scalable: the page has its own pinch-to-zoom (viewControls.js);
     without this, some browsers also zoom the whole page on top of it. iOS mostly
     ignores this itself (see touch-action in css/panel.css and css/graph.css for
     what actually stops it there), but it's a harmless backstop for others. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Graph View</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<!-- The page is dark-only: tells the browser (scrollbars, form controls) and
     dark-mode extensions not to invert it. darkreader-lock is Dark Reader's opt-out. -->
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/graph.css">
<link rel="stylesheet" href="css/panel.css">
<!-- Per-node and per-edge styles: edit alongside data/nodes.js and data/edges.js -->
<link rel="stylesheet" href="data/customstyles.css">
</head>
<body>

<!-- Background stars, drawn in js/stars.js. A canvas of its own, so turning the
     stars doesn't repaint the graph -->
<canvas id="stars"></canvas>

<svg id="graph" width="100%" height="100%">
  <!-- Pan and zoom move this group -->
  <g id="viewport">
    <!-- Edges must be drawn before nodes so nodes render on top;
         edges marked `behind` go underneath the others -->
    <g id="edges-behind"></g>
    <g id="edges"></g>
    <g id="nodes"></g>
  </g>
</svg>

<!-- Sliders are generated from settingsConfig by js/panel.js.
     Collapsible so it doesn't cover the graph on small screens. -->
<details id="settings">
  <summary>Settings</summary>
</details>

<!-- Graph data: edit these files to change the nodes and their connections.
     data/ is gitignored; create it by copying example-data/ -->
<script src="data/nodes.js"></script>
<script src="data/edges.js"></script>

<!-- Plain scripts sharing one global scope (so the page also works from file://).
     Order matters: each script only uses what the ones above it define. -->
<script src="js/util.js"></script>       <!-- shared helpers -->
<script src="js/settings.js"></script>   <!-- simulation settings and defaults -->
<script src="js/graph.js"></script>      <!-- nodes and edges from the data files -->
<script src="js/physics.js"></script>    <!-- force simulation -->
<script src="js/view.js"></script>       <!-- camera: pan, zoom, coordinates -->
<script src="js/stars.js"></script>      <!-- background star field -->
<script src="js/render.js"></script>     <!-- SVG elements and drawing -->
<script src="js/hintScramble.js"></script> <!-- link hint text-scramble animation -->
<script src="js/nodeDrag.js"></script>   <!-- dragging and hovering nodes -->
<script src="js/viewControls.js"></script> <!-- mouse, touch and keyboard input for the camera -->
<script src="js/panel.js"></script>      <!-- settings panel -->
<script src="js/main.js"></script>       <!-- start the animation loop -->
</body>
</html>
