<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph View</title>
<link rel="stylesheet" href="style.css">
<!-- Per-node styles: edit alongside data/nodes.js -->
<link rel="stylesheet" href="data/customstyles.css">
</head>
<body>

<svg id="graph" width="100%" height="100%">
  <!-- Edges must be drawn before nodes so nodes render on top -->
  <g id="edges"></g>
  <g id="nodes"></g>
</svg>

<!-- Sliders are generated from settingsConfig in main.js.
     Collapsible so it doesn't cover the graph on small screens. -->
<details id="settings">
  <summary>Settings</summary>
</details>

<!-- Graph data: edit these files to change the nodes and their connections -->
<script src="data/nodes.js"></script>
<script src="data/edges.js"></script>
<script src="main.js"></script>
</body>
</html>
