<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph View</title>
<!-- The page is dark-only: tells the browser (scrollbars, form controls) and
     dark-mode extensions not to invert it. darkreader-lock is Dark Reader's opt-out. -->
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<!-- Per-node styles: edit alongside data/nodes.js -->
<link rel="stylesheet" href="data/customstyles.css">
</head>
<body>

<svg id="graph" width="100%" height="100%">
  <!-- Background stars, generated in main.js -->
  <g id="stars"></g>
  <!-- Pan and zoom move this group; the stars stay put behind it -->
  <g id="viewport">
    <!-- Edges must be drawn before nodes so nodes render on top;
         edges marked `behind` go underneath the others -->
    <g id="edges-behind"></g>
    <g id="edges"></g>
    <g id="nodes"></g>
  </g>
</svg>

<!-- Sliders are generated from settingsConfig in main.js.
     Collapsible so it doesn't cover the graph on small screens. -->
<details id="settings">
  <summary>Settings</summary>
</details>

<!-- Graph data: edit these files to change the nodes and their connections.
     data/ is gitignored; create it by copying example-data/ -->
<script src="data/nodes.js"></script>
<script src="data/edges.js"></script>
<script src="main.js"></script>
</body>
</html>
